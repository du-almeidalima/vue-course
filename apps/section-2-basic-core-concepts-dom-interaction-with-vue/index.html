<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Section 2 - Basics & Core Concepts - DOM Interaction with Vue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/src/styles.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
<header>
  <h1>Vue Course Goals</h1>
</header>
<section id="user-goal">
  <h2>My Course Goal</h2>
  <p>{{ getRandomGoal() }}</p>
  <!--
    v-bind dynamically binds an HTML attribute to a reactive data property.
    href is set from vueLink instead of hardcoded markup, so when vueLink changes,
    Vue updates the DOM automatically — no manual getElementById/setAttribute needed.
    Shorthand: :href="vueLink" (identical behavior).
  -->
  <a v-bind:href="vueLink">Learn more about Vue</a>

  <!--
    v-html renders raw HTML strings instead of plain text (which {{ }} escapes).
    Use with caution: only render trusted content to avoid Cross-Site Scripting (XSS) vulnerabilities.
  -->
  <p v-html="htmlCourseGoal"></p>
  <div class="counter">
    <button v-on:click="incrementCounter">{{ counter }}</button>
  </div>
</section>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
