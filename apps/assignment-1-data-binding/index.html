<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Assignment 1 - Data Binding</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <section id="assignment">
      <!-- 1) Output your name -->
      <h2>{{ name }}</h2>
      <!-- 2) Output your age -->
      <p>{{ age }}</p>
      <!-- 3) Output your age + 5 -->
      <p>{{ age + 5 }}</p>
      <!-- 4) Output a random number (0 to 1) -->
      <p>Favorite Number: {{ getRandomNumber() }}</p>
      <div>
        <!-- 5) Display some image you found via Google -->
        <img v-bind:src="imageLink" style="max-width: 100%" height="auto" alt="Nice Cockatoo" />
      </div>
      <!-- 6) Prepopulate the input field with your name via the "value" attribute -->
      <input type="text" v-bind:value="inputValue" />
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
